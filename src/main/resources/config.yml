# NexusMerchants -- a massive overhaul of villager (and wandering trader) trading.
#
# Every trade a player sees is still a real, ordinary vanilla MerchantRecipe in the real trading
# GUI -- this plugin only changes what those trades cost, how many a villager offers, and how they
# move over time. Which base trades exist for each profession is fixed in ProfessionTradeCatalog,
# not here -- same "shared numbers in config, game-balance data in code" split NexusArcanum already
# established for its own enchantment catalog.

enabled: true

pricing:
  # How much a specific trade's live price multiplier climbs, per completed use, toward
  # max-multiplier. This is what makes hammering the same trade over and over genuinely cost more
  # (or pay out less) as it goes -- separate from vanilla's own fast-resetting per-trade demand.
  surge-per-use: 0.05
  # How much every trade's multiplier eases back toward baseline (1.0) each restock interval (see
  # restock.interval-minutes below) it isn't used.
  decay-per-interval: 0.03
  min-multiplier: 0.55
  max-multiplier: 1.85

# Odds a freshly-tagged villager or wandering trader rolls each TradeTier -- weights, not
# percentages (see MerchantsConfig#rollTier for the roll itself). Standard should stay by far the
# most common; Legendary should stay rare.
tier-roll-weights:
  standard: 100.0
  skilled: 45.0
  expert: 18.0
  master: 6.0
  legendary: 1.5

reputation:
  # Reputation points gained per completed trade with one specific villager.
  per-trade: 1
  acquaintance-threshold: 6
  friend-threshold: 16
  trusted-threshold: 32
  confidant-threshold: 60

restock:
  # How often (real minutes) the scheduler sweeps every tagged, loaded villager: eases their price
  # memory, and rolls the chance below for a real, visible restock. Predictable and known, unlike
  # vanilla's own sleep-near-a-lectern trigger.
  interval-minutes: 15
  # Chance, per villager, per interval, that one of their trades gets a real restock.
  chance: 0.4
  bonus-min-uses: 2
  bonus-max-uses: 5

dialogue:
  # Master switch for the trade-scoped flavor lines below. Deliberately narrow -- see README.md's
  # own section on why this never became a general right-click chat system (that's NexusMinds'
  # job, not this plugin's). Turn this whole section off if it ends up feeling redundant.
  enabled: true
  # A reputation-flavored line when a player opens this villager's trade window.
  greeting: true
  # A short flavor line right after a completed trade.
  completion: true
  # An announcement (plus a sound and particle) when a villager actually restocks.
  restock-announcement: true
